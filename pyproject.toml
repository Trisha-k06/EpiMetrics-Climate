[project]
name = "epimetrics"
version = "1.0.0"
requires-python = ">=3.12"
# Runtime dependencies only; Vercel installs exactly this list. Keep requirements.txt in sync.
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.13",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "PyJWT>=2.8",
    "statsmodels>=0.14",
    "scikit-learn>=1.5",
]

[project.optional-dependencies]
# Tests only (pytest + browser e2e); never installed on Vercel. Mirrors requirements-dev.txt.
test = [
    "pytest>=8",
    "httpx>=0.27",
    "playwright>=1.45",
    "pypdf>=4",
]

[tool.vercel]
entrypoint = "backend.app:app"
